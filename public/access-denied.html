<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Access Denied</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f6f8fb; }
    .card { max-width:520px; text-align:center; padding:24px; border-radius:8px; background:white; border:1px solid #e7eefb; box-shadow:0 6px 24px rgba(12,30,50,0.04); }
    a { color:#0366d6; text-decoration:none; }
    code { background:#f3f4f6; padding:4px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access Denied</h1>
    <p>The admin authorization link is missing or incorrect.</p>
    <p>If you are the admin, open the correct link: <code>/admin?token=YOUR_ADMIN_TOKEN</code></p>
    <p><a href="/">Return to Landing</a></p>
  </div>
</body>
</html>
